name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: if_line
          POSTGRES_PASSWORD: if_line_test
          POSTGRES_DB: if_line_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U if_line -d if_line_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://if_line:if_line_test@127.0.0.1:5432/if_line_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      OPENAI_API_KEY: test-only-placeholder
      TASK_SYSTEM_ENABLED: "true"
      REVISION_READ_ENABLED: "true"
      MEDIA_GATEWAY_ENABLED: "true"
      BRANCHING_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -m "not integration and not regression_pending" -q
      - run: python -m alembic downgrade 0002_runtime_foundation
      - run: python -m alembic upgrade head

